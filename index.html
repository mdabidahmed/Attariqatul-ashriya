<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Resolves the theme preference before the first paint, so a returning
      // visitor never sees a flash of the wrong theme. Mirrors the same
      // "System" resolution `useTheme` does once React mounts, and the same
      // localStorage key `state/storage.ts` writes it under.
      ;(function () {
        try {
          var raw = window.localStorage.getItem('attariqa.v1.theme')
          var theme = raw ? JSON.parse(raw) : null
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', theme)
        } catch (error) {
          // No storage, no matchMedia: fall through to the default light theme.
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4f91" />
    <meta
      name="description"
      content="Multiple-choice practice for the exercises in At-Tareeqatul Asriyyah, Part I."
    />
    <title>At-Tareeqatul Asriyyah — Practice</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://verses.quran.foundation" crossorigin />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://verses.quran.foundation/fonts/quran/hafs/nastaleeq/indopak/indopak-nastaleeq-waqf-lazim-v4.2.1.woff2"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Nastaliq+Urdu:wght@400;500;700&family=Spectral:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
